name: Build Next.js app
description: Checkout, setup Node 22, npm ci, and build with Keystatic placeholders
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
      shell: bash
    - name: Build
      env:
        KEYSTATIC_GITHUB_CLIENT_ID: build-placeholder
        KEYSTATIC_GITHUB_CLIENT_SECRET: build-placeholder
        KEYSTATIC_SECRET: build-placeholder-secret-minimum-32-chars
      run: npm run build
      shell: bash
