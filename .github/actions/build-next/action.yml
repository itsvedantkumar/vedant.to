name: Build Next.js app
description: Checkout, setup Node 20, npm ci, and build with Keystatic placeholders
runs:
  using: composite
  steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
      shell: bash
    - name: Build
      env:
        KEYSTATIC_GITHUB_CLIENT_ID: build-placeholder
        KEYSTATIC_GITHUB_CLIENT_SECRET: build-placeholder
        KEYSTATIC_SECRET: build-placeholder-secret-minimum-32-chars
      run: npm run build
      shell: bash
