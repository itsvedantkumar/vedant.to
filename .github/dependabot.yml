version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # next@15.x hard-pins postcss@8.4.31; no safe upgrade path until Next.js ships it
      - dependency-name: 'postcss'
    groups:
      # React ecosystem must move together — peer deps break if split across PRs
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # Batch all other low-risk updates into one PR to cut noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
