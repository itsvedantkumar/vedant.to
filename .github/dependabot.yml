version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React ecosystem must move together — peer deps break if split across PRs.
      # `next` belongs in this group: Next 16 requires React 19, so a split into
      # two PRs leaves each one red in isolation and neither can be merged.
      react:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # Batch all other low-risk updates into one PR to cut noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all action bumps instead of one per action.
      github-actions:
        patterns:
          - '*'
