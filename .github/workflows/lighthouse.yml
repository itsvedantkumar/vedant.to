name: Lighthouse

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'lighthouse-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      # Required before ./.github/actions/build-next — a local action only
      # exists on the runner once the repo is checked out.
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-next

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
