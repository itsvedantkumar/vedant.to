name: Security Audit

# Dependency vulnerability scan that works on private repos without GitHub
# Advanced Security (which CodeQL code-scanning would require). Fails on high/
# critical advisories so they surface; runs weekly and on dependency changes.
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - package.json
      - package-lock.json
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'security-audit-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high
