name: Setup Vercel Env Vars

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Required: `vercel deploy --prod` below uploads the working directory and
      # builds it remotely. Without a checkout the dir is empty, so it would
      # deploy an empty app (404 on every route). This step makes the source present.
      - uses: actions/checkout@v4

      - name: Set Keystatic env vars on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Secrets — add these under repo Settings → Secrets and variables → Actions.
          # If a secret is unset it is skipped (the existing Vercel value is left untouched),
          # so this workflow is safe to run before all secrets are populated.
          KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
          KEYSTATIC_AUTH_PASSWORD: ${{ secrets.KEYSTATIC_AUTH_PASSWORD }}
        run: |
          set_env() {
            local key=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "SKIP: $key (no value — add it as a GitHub Actions secret)"
              return
            fi
            # upsert=true so re-running overwrites existing values (needed for rotation).
            curl -s -X POST \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$key\",\"value\":\"$value\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('OK:', r.get('key','?'), '|', r.get('error',{}).get('message',''))"
          }

          # Public, non-secret values (safe to keep inline):
          set_env "NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG" "itsvedantkumar-keystatic"
          # Secrets (sourced from GitHub Actions secrets in the env block above):
          set_env "KEYSTATIC_GITHUB_CLIENT_ID"            "$KEYSTATIC_GITHUB_CLIENT_ID"
          set_env "KEYSTATIC_GITHUB_CLIENT_SECRET"        "$KEYSTATIC_GITHUB_CLIENT_SECRET"
          set_env "KEYSTATIC_SECRET"                      "$KEYSTATIC_SECRET"
          set_env "KEYSTATIC_AUTH_PASSWORD"               "$KEYSTATIC_AUTH_PASSWORD"

      - name: Trigger redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: npx vercel deploy --prod --token $VERCEL_TOKEN --yes
