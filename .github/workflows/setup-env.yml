name: Setup Vercel Env Vars

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      # Required: `vercel deploy --prod` below uploads the working directory and
      # builds it remotely. Without a checkout the dir is empty, so it would
      # deploy an empty app (404 on every route). This step makes the source present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Keystatic env vars on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Secrets — add these under repo Settings → Secrets and variables → Actions.
          # If a secret is unset it is skipped (the existing Vercel value is left untouched),
          # so this workflow is safe to run before all secrets are populated.
          KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
          KEYSTATIC_AUTH_PASSWORD: ${{ secrets.KEYSTATIC_AUTH_PASSWORD }}
          KEYSTATIC_SESSION_SECRET: ${{ secrets.KEYSTATIC_SESSION_SECRET }}
          KEYSTATIC_ENROLL_TOKEN: ${{ secrets.KEYSTATIC_ENROLL_TOKEN }}
          KEYSTATIC_AUTH_MODE: ${{ secrets.KEYSTATIC_AUTH_MODE }}
          # JSON question bank for /whisper. A secret because the answers are
          # personal data (dob, tastes) — keeping them out of the repo is what
          # lets this repo be made public.
          WHISPER_QUIZ: ${{ secrets.WHISPER_QUIZ }}
          KEYSTATIC_ALERT_EMAIL: ${{ secrets.KEYSTATIC_ALERT_EMAIL }}
          KEYSTATIC_RP_ID: ${{ secrets.KEYSTATIC_RP_ID }}
          # Inlined into the client bundle at build time, not read at runtime, so
          # it must exist on Vercel *before* the build or analytics silently no-op
          # with nothing in the logs to explain it.
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          WHISPER_TOKEN_SECRET: ${{ secrets.WHISPER_TOKEN_SECRET }}
          WHISPER_TO_EMAIL: ${{ secrets.WHISPER_TO_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROXYCHECK_API_KEY: ${{ secrets.PROXYCHECK_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set_env() {
            local key=$1
            local value=$2
            if [ -z "$value" ]; then
              echo "SKIP: $key (no value — add it as a GitHub Actions secret)"
              return
            fi
            local payload
            # Key/value travel via env, not argv — argv is world-readable on the
            # runner (/proc/*/cmdline), env is not.
            payload=$(SET_ENV_KEY="$key" SET_ENV_VALUE="$value" python3 -c "import json,os; print(json.dumps({'key':os.environ['SET_ENV_KEY'],'value':os.environ['SET_ENV_VALUE'],'type':'encrypted','target':['production','preview']}))")
            curl -s -X POST \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('OK:', r.get('key','?'), '|', r.get('error',{}).get('message',''))"
          }

          # Public, non-secret values (safe to keep inline):
          set_env "NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG" "itsvedantkumar-keystatic"
          # A bucket NAME is not a secret; the R2 credentials that reach it are.
          # This must stay pointed at a PRIVATE bucket: /api/whisper writes reader
          # messages here, and it used to fall back to the public assets bucket.
          set_env "WHISPER_BUCKET_NAME"                   "vedant-whispers"
          # Secrets (sourced from GitHub Actions secrets in the env block above):
          set_env "KEYSTATIC_GITHUB_CLIENT_ID"            "$KEYSTATIC_GITHUB_CLIENT_ID"
          set_env "KEYSTATIC_GITHUB_CLIENT_SECRET"        "$KEYSTATIC_GITHUB_CLIENT_SECRET"
          set_env "KEYSTATIC_SECRET"                      "$KEYSTATIC_SECRET"
          set_env "KEYSTATIC_AUTH_PASSWORD"               "$KEYSTATIC_AUTH_PASSWORD"
          set_env "KEYSTATIC_SESSION_SECRET"             "$KEYSTATIC_SESSION_SECRET"
          set_env "KEYSTATIC_ENROLL_TOKEN"               "$KEYSTATIC_ENROLL_TOKEN"
          set_env "KEYSTATIC_AUTH_MODE"                  "$KEYSTATIC_AUTH_MODE"
          set_env "WHISPER_QUIZ"                         "$WHISPER_QUIZ"
          set_env "KEYSTATIC_ALERT_EMAIL"                "$KEYSTATIC_ALERT_EMAIL"
          set_env "KEYSTATIC_RP_ID"                      "$KEYSTATIC_RP_ID"
          set_env "NEXT_PUBLIC_GA_ID"                    "$NEXT_PUBLIC_GA_ID"
          set_env "WHISPER_TOKEN_SECRET"                 "$WHISPER_TOKEN_SECRET"
          set_env "WHISPER_TO_EMAIL"                     "$WHISPER_TO_EMAIL"
          set_env "RESEND_API_KEY"                       "$RESEND_API_KEY"
          set_env "PROXYCHECK_API_KEY"                   "$PROXYCHECK_API_KEY"
          set_env "UPSTASH_REDIS_REST_URL"               "$UPSTASH_REDIS_REST_URL"
          set_env "UPSTASH_REDIS_REST_TOKEN"             "$UPSTASH_REDIS_REST_TOKEN"

      - name: Trigger redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        # Pinned: an unpinned npx resolves latest from npm at run time and would
        # hand a compromised release this job's production deploy token.
        run: npx vercel@59.11.0 deploy --prod --token "$VERCEL_TOKEN" --yes
