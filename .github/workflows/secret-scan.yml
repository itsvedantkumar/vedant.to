name: Secret Scan

# Compensating control for GitHub secret scanning + push protection, which are
# unavailable on this private repo without GitHub Advanced Security. Gitleaks
# scans every push and PR for committed credentials and fails the run if any
# are found. Full-history scan on the weekly schedule.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # gitleaks lists PR commits via the API on pull_request runs

concurrency:
  group: 'secret-scan-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scheduled run audits past commits, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
