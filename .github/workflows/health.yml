name: Production Health

# Probe of the live site + latest Vercel production deployment (6x daily).
# On failure it opens (or comments on) a single GitHub issue so problems
# surface without inbox spam. Manual run available via the Actions tab.
on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # 6x daily (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check public routes return 200
        id: routes
        run: |
          set -uo pipefail
          BASE="https://vedant.to"
          ROUTES="/ /blog /rss.xml /feed.json /sitemap.xml /robots.txt"
          FAIL=""
          for r in $ROUTES; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$r")
            echo "$r -> $CODE"
            if [ "$CODE" != "200" ]; then FAIL="$FAIL\n$r returned $CODE"; fi
          done
          # Homepage must contain the site name (catches blank/error pages that still 200).
          if ! curl -s --max-time 20 "$BASE/" | grep -q "Vedant"; then
            FAIL="$FAIL\nhomepage missing expected content"
          fi
          if [ -n "$FAIL" ]; then
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "Route check failures:$FAIL" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Check latest Vercel production deployment state
        if: always()
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Vercel secrets unset — skipping deployment-state check"
            exit 0
          fi
          RESP=$(curl -s --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=1")
          STATE=$(echo "$RESP" | jq -r '.deployments[0].state // "UNKNOWN"')
          CREATED_AT=$(echo "$RESP" | jq -r '.deployments[0].createdAt // 0')
          PROD_SHA=$(echo "$RESP" | jq -r '.deployments[0].meta.githubCommitSha // .deployments[0].gitSource.sha // ""')
          echo "Latest production deployment state: $STATE"
          echo "created_at=$CREATED_AT" >> "$GITHUB_OUTPUT"
          echo "prod_sha=$PROD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo "Latest Vercel production deployment state: $STATE" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Check production is not behind main
        if: always()
        id: drift
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_CREATED_AT: ${{ steps.vercel.outputs.created_at }}
          PROD_SHA: ${{ steps.vercel.outputs.prod_sha }}
        run: |
          set -uo pipefail
          REPO="${GITHUB_REPOSITORY}"
          MAIN_JSON=$(curl -s --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/main")
          MAIN_SHA=$(echo "$MAIN_JSON" | jq -r '.sha // ""')
          MAIN_COMMITTED_AT=$(echo "$MAIN_JSON" | jq -r '.commit.committer.date // ""')
          if [ -z "$MAIN_SHA" ] || [ -z "$MAIN_COMMITTED_AT" ]; then
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo "Unable to determine latest main commit for drift check." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ -n "${PROD_SHA:-}" ] && [ "$PROD_SHA" = "$MAIN_SHA" ]; then
            echo "Production SHA matches main: $MAIN_SHA"
            exit 0
          fi

          if [ -z "${PROD_CREATED_AT:-}" ] || [ "$PROD_CREATED_AT" = "0" ]; then
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo "Unable to determine latest production deployment timestamp for drift check." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          MAIN_TS=$(date -u -d "$MAIN_COMMITTED_AT" +%s)
          PROD_TS=$((PROD_CREATED_AT / 1000))
          GRACE_SECONDS=900

          if [ "$MAIN_TS" -le $((PROD_TS + GRACE_SECONDS)) ]; then
            echo "Production deploy is within grace window of main."
            exit 0
          fi

          echo "details<<EOF" >> "$GITHUB_OUTPUT"
          echo "Production appears behind main." >> "$GITHUB_OUTPUT"
          echo "main sha: $MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "prod sha: ${PROD_SHA:-unknown}" >> "$GITHUB_OUTPUT"
          echo "main committed at: $MAIN_COMMITTED_AT" >> "$GITHUB_OUTPUT"
          echo "prod created at (unix): $PROD_TS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Open or update alert issue
        if: failure()
        uses: actions/github-script@v7
        env:
          ROUTES_DETAILS: ${{ steps.routes.outputs.details }}
          VERCEL_DETAILS: ${{ steps.vercel.outputs.details }}
          DRIFT_DETAILS: ${{ steps.drift.outputs.details }}
        with:
          script: |
            const body = [
              '### 🚨 Production health check failed',
              '',
              'One or more checks failed during the hourly probe.',
              '',
              '```',
              process.env.ROUTES_DETAILS || '',
              process.env.VERCEL_DETAILS || '',
              process.env.DRIFT_DETAILS || '',
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const title = '🚨 Production health check failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['health'],
              });
            }
