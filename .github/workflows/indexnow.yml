name: IndexNow

# Pings IndexNow (Bing, Yandex, Seznam, …) after each successful production
# deploy so new/changed posts get crawled within minutes instead of days.
# Triggered by deployment_status, not push: Vercel deploys via its own Git
# integration (no Actions deploy workflow exists) and reports deployment state
# back to GitHub, so this fires only once the URLs are actually live — a push
# trigger would race the deploy and submit URLs that still 404. The key is
# public by design and is served at /<key>.txt. Google ignores IndexNow —
# submit the sitemap once in Google Search Console for that engine.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'indexnow'
  cancel-in-progress: true

jobs:
  ping:
    # deployment_status fires for every state and environment; only ping when a
    # Production deploy succeeded (Vercel names the environment "Production").
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Submit URLs to IndexNow
        env:
          KEY: 6b3d50d9f977ead7a83ee04e62745866 # gitleaks:allow
        run: |
          set -euo pipefail
          HOST="$(node scripts/site.mjs host)"
          URLS=$(jq -R -s -c '
            split("\n") | map(select(length > 0))
          ' < <(
            printf "https://%s/\n" "$HOST"
            printf "https://%s/blog\n" "$HOST"
            printf "https://%s/daily\n" "$HOST"
            # Quotes are index-only: app/(site)/quotes has no [slug] route, so
            # per-quote URLs would submit 404s to IndexNow.
            printf "https://%s/quotes\n" "$HOST"
            for f in content/posts/*.mdoc; do
              [ -e "$f" ] || continue
              grep -q 'draft: true' "$f" && continue
              slug=$(basename "$f" .mdoc)
              printf "https://%s/blog/%s\n" "$HOST" "$slug"
            done
            for f in content/daily/*.mdoc; do
              [ -e "$f" ] || continue
              grep -q 'draft: true' "$f" && continue
              slug=$(basename "$f" .mdoc)
              printf "https://%s/daily/%s\n" "$HOST" "$slug"
            done
          ))
          echo "Submitting: $URLS"
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}"
