name: Deploy to Vercel and Backup Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Run daily backups
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy-and-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npx vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }}

      - name: Install Sanity CLI
        run: npm install -g @sanity/cli

      - name: Export Sanity Dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
        run: |
          mkdir -p backups
          npx sanity dataset export $NEXT_PUBLIC_SANITY_DATASET backups/sanity-export-$(date +%Y-%m-%d).tar.gz --project $NEXT_PUBLIC_SANITY_PROJECT_ID

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanity-backup-${{ github.run_id }}
          path: backups/*.tar.gz
          retention-days: 90
