name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        # Placeholder secrets let the Keystatic route handler pass without throwing.
        # These are NOT baked into the bundle — server env vars are read at runtime
        # from Vercel's configured environment variables.
        env:
          KEYSTATIC_GITHUB_CLIENT_ID: build-placeholder
          KEYSTATIC_GITHUB_CLIENT_SECRET: build-placeholder
          KEYSTATIC_SECRET: build-placeholder-secret-minimum-32-chars
        run: npm run build

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -s -X POST "https://api.vercel.com/v1/integrations/deploy/prj_H7FbvQwd30eUAzyUURXPnOYijWDY/QX6ZClWej4"
