name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: 'deploy-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Normalize content
        run: node scripts/normalize-content.mjs

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build
        # Placeholder secrets let the Keystatic route handler pass without throwing.
        # These are NOT baked into the bundle — server env vars are read at runtime
        # from Vercel's configured environment variables.
        env:
          KEYSTATIC_GITHUB_CLIENT_ID: build-placeholder
          KEYSTATIC_GITHUB_CLIENT_SECRET: build-placeholder
          KEYSTATIC_SECRET: build-placeholder-secret-minimum-32-chars
        run: npm run build

      - name: Sync images to R2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/sync-images-to-r2.mjs

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
