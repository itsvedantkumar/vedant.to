name: Daily Content Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Job-level so the off-GitHub steps' `if:` can read them. Empty when unset.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BACKUP_BUCKET_NAME: ${{ secrets.R2_BACKUP_BUCKET_NAME }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create dated snapshot tag
        run: |
          TAG="backup/$(date +%Y-%m-%d)"
          git tag "$TAG" || echo "Tag $TAG already exists, skipping"
          git push origin "$TAG" || echo "Tag push skipped"

      - name: Zip content and images
        run: zip -r content-backup.zip content/ public/images/

      - name: Verify backup integrity
        run: |
          unzip -t content-backup.zip > /dev/null
          COUNT=$(find content -type f | wc -l)
          IMG_COUNT=$(find public/images -type f | wc -l)
          echo "Backed up $COUNT content files and $IMG_COUNT image files"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::content/ is empty — refusing to publish an empty backup"
            exit 1
          fi
          if [ "$IMG_COUNT" -eq 0 ]; then
            echo "::error::public/images/ is empty — refusing to publish an incomplete backup"
            exit 1
          fi
          # Both trees must actually be present inside the archive, not just on disk.
          unzip -l content-backup.zip | grep -q 'content/' \
            || { echo "::error::archive missing content/"; exit 1; }
          unzip -l content-backup.zip | grep -q 'public/images/' \
            || { echo "::error::archive missing public/images/"; exit 1; }

      - name: Upload content snapshot
        uses: actions/upload-artifact@v4
        with:
          name: content-${{ github.run_id }}-${{ github.run_attempt }}
          path: content-backup.zip
          retention-days: 90
          if-no-files-found: error

      # Off-GitHub copy so the backup survives loss of the GitHub account.
      #
      # This MUST target R2_BACKUP_BUCKET_NAME, never R2_BUCKET_NAME. The latter
      # is the live asset bucket, which is fronted by the public custom domain
      # assets.vedant.to — anything written there is world-readable. Backups
      # contain unpublished drafts, so they go to a private bucket with no
      # domain binding. Skipped automatically when the secrets are not set.
      - name: Upload to R2 (off-GitHub, private bucket)
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_ACCOUNT_ID != '' && env.R2_BACKUP_BUCKET_NAME != '' }}
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          KEY="backups/content-$(date +%Y-%m-%d).zip"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          aws s3 cp content-backup.zip "s3://$R2_BACKUP_BUCKET_NAME/$KEY" \
            --endpoint-url "$ENDPOINT"
          echo "Uploaded s3://$R2_BACKUP_BUCKET_NAME/$KEY"

      # Snapshot the live asset bucket itself. Objects written at runtime —
      # /api/upload images (bare UUID keys) and whisper messages — exist ONLY in
      # R2 and have no copy in the repo, so the zip above cannot capture them.
      # `backups/*` is excluded so we never re-ingest an old backup.
      - name: Mirror live R2 objects into backup bucket
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_ACCOUNT_ID != '' && env.R2_BACKUP_BUCKET_NAME != '' }}
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          aws s3 sync "s3://$R2_BUCKET_NAME/" \
            "s3://$R2_BACKUP_BUCKET_NAME/r2-assets/" \
            --exclude 'backups/*' \
            --endpoint-url "$ENDPOINT"
          echo "Mirrored s3://$R2_BUCKET_NAME/ -> s3://$R2_BACKUP_BUCKET_NAME/r2-assets/"
