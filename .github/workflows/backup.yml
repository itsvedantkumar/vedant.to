name: Daily Content Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Job-level so the off-GitHub step's `if:` can read them. Empty when unset.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create dated snapshot tag
        run: |
          TAG="backup/$(date +%Y-%m-%d)"
          git tag "$TAG" || echo "Tag $TAG already exists, skipping"
          git push origin "$TAG" || echo "Tag push skipped"

      - name: Zip content directory
        run: zip -r content-backup.zip content/

      - name: Verify backup integrity
        run: |
          unzip -t content-backup.zip > /dev/null
          COUNT=$(find content -type f | wc -l)
          echo "Backed up $COUNT files"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::content/ is empty — refusing to publish an empty backup"
            exit 1
          fi

      - name: Upload content snapshot
        uses: actions/upload-artifact@v4
        with:
          name: content-${{ github.run_id }}-${{ github.run_attempt }}
          path: content-backup.zip
          retention-days: 90
          if-no-files-found: error

      # Off-GitHub copy to an S3-compatible bucket (e.g. Cloudflare R2) so the
      # backup survives loss of the GitHub account. Skipped automatically when
      # the R2_* secrets are not configured.
      - name: Upload to R2 (off-GitHub)
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_ENDPOINT != '' }}
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          KEY="backups/content-$(date +%Y-%m-%d).zip"
          AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
          aws s3 cp content-backup.zip "s3://$R2_BUCKET/$KEY" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Uploaded s3://$R2_BUCKET/$KEY"
