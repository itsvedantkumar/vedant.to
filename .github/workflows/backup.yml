name: Daily Content Backup

on:
  schedule:
    # Off the hour: GitHub drops scheduled runs under load, and midnight UTC
    # on the hour is peak contention. 2026-08-27's run never fired.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Job-level so the off-GitHub steps' `if:` can read them. Empty when unset.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BACKUP_BUCKET_NAME: ${{ secrets.R2_BACKUP_BUCKET_NAME }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] -- this job pushes a tag and needs the token
        with:
          fetch-depth: 0

      - name: Create dated snapshot tag
        run: |
          TAG="backup/$(date +%Y-%m-%d)"
          git tag "$TAG" || echo "Tag $TAG already exists, skipping"
          git push origin "$TAG" || echo "Tag push skipped"

      - name: Zip content and images
        run: |
          set -euo pipefail
          # public/images/ is normally absent: Keystatic writes uploads there
          # locally but publishes CDN URLs, and git does not track empty dirs.
          # Pass it to zip only when it exists, otherwise zip warns on an
          # unmatched path.
          TARGETS="content/"
          if [ -d public/images ]; then TARGETS="$TARGETS public/images/"; fi
          # shellcheck disable=SC2086
          zip -r content-backup.zip $TARGETS

      - name: Verify backup integrity
        run: |
          set -euo pipefail
          unzip -t content-backup.zip > /dev/null
          COUNT=$(find content -type f | wc -l | tr -d ' ')
          # Guard with -d rather than swallowing stderr: under `pipefail` a
          # `find` on a missing dir fails the whole pipeline and kills the step.
          if [ -d public/images ]; then
            IMG_COUNT=$(find public/images -type f | wc -l | tr -d ' ')
          else
            IMG_COUNT=0
          fi
          echo "Backed up $COUNT content files and $IMG_COUNT image files"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::content/ is empty — refusing to publish an empty backup"
            exit 1
          fi
          # public/images/ is deliberately NOT asserted non-empty. The live image
          # corpus lives in R2 and is captured by the bucket mirror step below;
          # the local dir is a staging area that is legitimately empty. Asserting
          # otherwise made this job fail permanently once the orphaned files were
          # removed.
          #
          # The real integrity guard is a count match: every file on disk must
          # appear in the archive. That still catches a truncated or partial zip,
          # no matter how many images exist.
          ZIPPED_CONTENT=$(unzip -Z1 content-backup.zip | grep -c '^content/.*[^/]$' || true)
          if [ "$ZIPPED_CONTENT" -ne "$COUNT" ]; then
            echo "::error::archive holds $ZIPPED_CONTENT content files but disk has $COUNT"
            exit 1
          fi
          if [ "$IMG_COUNT" -gt 0 ]; then
            ZIPPED_IMG=$(unzip -Z1 content-backup.zip | grep -c '^public/images/.*[^/]$' || true)
            if [ "$ZIPPED_IMG" -ne "$IMG_COUNT" ]; then
              echo "::error::archive holds $ZIPPED_IMG image files but disk has $IMG_COUNT"
              exit 1
            fi
          fi

      - name: Upload content snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-${{ github.run_id }}-${{ github.run_attempt }}
          path: content-backup.zip
          retention-days: 90
          if-no-files-found: error

      # Off-GitHub copy so the backup survives loss of the GitHub account.
      #
      # This MUST target R2_BACKUP_BUCKET_NAME, never R2_BUCKET_NAME. The latter
      # is the live asset bucket, which is fronted by the public assets host — anything
      # written there is world-readable. Backups contain unpublished drafts, so they
      # go to a private bucket with no domain binding. Skipped automatically when the
      # secrets are not set.
      - name: Upload to R2 (off-GitHub, private bucket)
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_ACCOUNT_ID != '' && env.R2_BACKUP_BUCKET_NAME != '' }}
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          KEY="backups/content-$(date +%Y-%m-%d).zip"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          aws s3 cp content-backup.zip "s3://$R2_BACKUP_BUCKET_NAME/$KEY" \
            --endpoint-url "$ENDPOINT"
          echo "Uploaded s3://$R2_BACKUP_BUCKET_NAME/$KEY"

      # Snapshot the live asset bucket itself. Objects written at runtime —
      # /api/upload images (bare UUID keys) and whisper messages — exist ONLY in
      # R2 and have no copy in the repo, so the zip above cannot capture them.
      # `backups/*` is excluded so we never re-ingest an old backup.
      - name: Mirror live R2 objects into backup bucket
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_ACCOUNT_ID != '' && env.R2_BACKUP_BUCKET_NAME != '' }}
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          aws s3 sync "s3://$R2_BUCKET_NAME/" \
            "s3://$R2_BACKUP_BUCKET_NAME/r2-assets/" \
            --exclude 'backups/*' \
            --endpoint-url "$ENDPOINT"
          echo "Mirrored s3://$R2_BUCKET_NAME/ -> s3://$R2_BACKUP_BUCKET_NAME/r2-assets/"
