name: Link Check

on:
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check links in content
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 'content/**/*.mdoc' 'README.md'
          fail: true
