name: Link Check

on:
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links in content
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 403/429 are accepted deliberately. Every failure this job has ever
          # produced was a bot-block from a publisher that refuses datacenter
          # IPs (merriam-webster, doi.org, researchgate, SSRN, medium,
          # pewresearch, rand.org, bigthink) — not one was a dead link. Treating
          # them as failures trained everyone to ignore the job, which defeats
          # the point. 200/206 still prove reachability; a real 404/410/DNS
          # failure still fails the build.
          args: >-
            --no-progress --max-concurrency 4
            --accept 200,206,403,429
            'content/**/*.mdoc' 'README.md'
          fail: true
