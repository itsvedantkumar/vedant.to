name: Link Check

on:
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in content
        uses: lycheeverse/lychee-action@82202c37d2f6a4bc44e038bdf84e6ededef12afa # v2.4.1
        with:
          args: --no-progress --max-concurrency 4 'content/**/*.mdoc' 'README.md'
          fail: true
