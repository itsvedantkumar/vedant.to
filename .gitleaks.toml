# Extends the default ruleset. site.config.mjs holds public identity only
# (name, domain, handles, contact addresses); its `linkedin:` handle trips
# the linkedin-client-id rule, which matches any short quoted string after
# the word. Allowlist that one line shape, not the file.
[extend]
useDefault = true

[allowlist]
regexTarget = "line"
regexes = ['''^\s*linkedin: '[A-Za-z0-9._-]+',?\s*$''']
paths = ['''^site\.config\.mjs$''']
